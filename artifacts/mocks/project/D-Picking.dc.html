<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Game Show · Picking favorites</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Rubik:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
a{color:#3DE0FF}a:hover{color:#A8F0FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1440; color: #FFFFFF; font-family: 'Rubik', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 22px 16px 10px; display: flex; flex-direction: column; gap: 12px; text-align: center">
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px 8px; border: 3px solid #3DE0FF; border-radius: 6px; box-shadow: 0 0 12px rgba(61, 224, 255, 0.6), inset 0 0 12px rgba(61, 224, 255, 0.35)">
      <div style="font-family: 'Press Start 2P', monospace; font-size: 15px; color: #FF4FA3">KING SIZE</div>
      <div style="font-family: 'Press Start 2P', monospace; font-size: 26px; color: #FFD23F; text-shadow: 3px 3px 0 #FF4FA3">SHOWDOWN</div>
    </div>
    <p style="margin: 0; font-size: 16px; font-weight: 500; line-height: 1.4">Tap your <b style="color: #FFD23F; font-weight: 800">very favorite</b> first, then your next favorite. Pick as many as you like!</p>
  </header>

  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-content: start">
    <sc-for list="{{candies}}" as="c" hint-placeholder-count="13">
      <sc-if value="{{c.picked}}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{c.pick}}" aria-label="{{c.aria}}" style="display: flex; align-items: center; gap: 8px; height: 54px; padding: 0 10px; border-radius: 6px; border: 3px solid #FFD23F; background: #FFD23F; color: #0E1440; text-align: left; box-shadow: 0 0 14px rgba(255, 210, 63, 0.7)">
          <span style="font-family: 'Press Start 2P', monospace; font-size: 11px; flex: none; width: 34px">{{c.ord}}</span>
          <span style="font-size: 14px; font-weight: 800; line-height: 1.15">{{c.name}}</span>
        </button>
      </sc-if>
      <sc-if value="{{c.notPicked}}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{c.pick}}" aria-label="{{c.aria}}" style="display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 10px; border-radius: 6px; border: 3px solid #2B3576; background: #182058; color: #FFFFFF; text-align: left">
          <span aria-hidden="true" style="width: 14px; height: 14px; flex: none; border-radius: 3px; background: {{c.bg}}; box-shadow: 0 0 0 2px #FFFFFF"></span>
          <span style="font-size: 14px; font-weight: 700; line-height: 1.15">{{c.name}}</span>
        </button>
      </sc-if>
    </sc-for>
  </div>

  <footer style="background: #070B2A; border-top: 3px solid #FF4FA3; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-family: 'Press Start 2P', monospace; font-size: 10px; color: #FF4FA3">YOUR LINEUP</span>
      <a href="D-Results.dc.html" style="font-size: 14px; font-weight: 700">Scoreboard</a>
    </div>
    <sc-if value="{{hasPicks}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{chosen}}" as="p" hint-placeholder-count="3">
          <span style="display: flex; align-items: center; gap: 6px; background: #182058; border: 2px solid #2B3576; border-radius: 4px; padding: 3px 8px; font-size: 14px; font-weight: 700">
            <span style="font-family: 'Press Start 2P', monospace; font-size: 9px; color: #FFD23F">{{p.ord}}</span>
            {{p.name}}
          </span>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{noPicks}}" hint-placeholder-val="{{ false }}">
      <div style="font-size: 14px; color: #B9C0EA; padding: 4px 0">Nothing yet. Tap a candy!</div>
    </sc-if>
    <div style="display: flex; gap: 10px">
      <button type="button" onClick="{{clear}}" style="height: 56px; padding: 0 16px; border-radius: 6px; border: 3px solid #2B3576; background: transparent; color: #FFFFFF; font-size: 15px; font-weight: 700">Start over</button>
      <sc-if value="{{hasPicks}}" hint-placeholder-val="{{ true }}">
        <a href="D-Thanks.dc.html" style="flex: 1; height: 56px; border-radius: 6px; background: #FF4FA3; color: #0E1440; font-family: 'Press Start 2P', monospace; font-size: 15px; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 5px 0 #A3236A">I'M DONE!</a>
      </sc-if>
      <sc-if value="{{noPicks}}" hint-placeholder-val="{{ false }}">
        <button type="button" disabled="disabled" style="flex: 1; height: 56px; border-radius: 6px; border: 0; background: #2B3576; color: #8A92C4; font-family: 'Press Start 2P', monospace; font-size: 15px">I'M DONE!</button>
      </sc-if>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var CANDIES = [
  { id: 'reeses', name: "Reese's Cups", bg: '#F47B20' },
  { id: 'snickers', name: 'Snickers', bg: '#8A5A3A' },
  { id: 'kitkat', name: 'Kit Kat', bg: '#E0213F' },
  { id: 'twix', name: 'Twix', bg: '#D4A63A' },
  { id: 'hersheys', name: "Hershey's Milk Chocolate", bg: '#7A4A30' },
  { id: 'butterfinger', name: 'Butterfinger', bg: '#FFD200' },
  { id: 'musketeers', name: '3 Musketeers', bg: '#C9D3DB' },
  { id: 'milkyway', name: 'Milky Way', bg: '#9AD06B' },
  { id: 'crunch', name: 'Crunch', bg: '#2F7BE0' },
  { id: 'skittles', name: 'Skittles', bg: '#E8262C' },
  { id: 'starburst', name: 'Starburst', bg: '#FBB8CF' },
  { id: 'mms', name: "Peanut M&M's", bg: '#FDC300' },
  { id: 'cookies', name: "Cookies 'n' Creme", bg: '#F4F1EA' }
];
function ordinal(n) {
  var s = ['TH', 'ST', 'ND', 'RD'];
  var v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var picks = (this.state && this.state.picks) || ['kitkat', 'crunch', 'reeses', 'starburst'];
    var toggle = function (id) {
      var next = picks.slice();
      var i = next.indexOf(id);
      if (i >= 0) { next.splice(i, 1); } else { next.push(id); }
      self.setState({ picks: next });
    };
    var candies = CANDIES.map(function (c) {
      var rank = picks.indexOf(c.id) + 1;
      return {
        id: c.id, name: c.name, bg: c.bg, ord: rank > 0 ? ordinal(rank) : '',
        picked: rank > 0, notPicked: rank === 0,
        aria: rank > 0 ? c.name + ', pick number ' + rank : c.name,
        pick: function () { toggle(c.id); }
      };
    });
    var chosen = picks.map(function (id, i) {
      var c = CANDIES.filter(function (x) { return x.id === id; })[0];
      return { ord: ordinal(i + 1), name: c.name };
    });
    return {
      candies: candies, chosen: chosen,
      hasPicks: chosen.length > 0, noPicks: chosen.length === 0,
      clear: function () { self.setState({ picks: [] }); }
    };
  }
}
</script>
</body>
</html>
