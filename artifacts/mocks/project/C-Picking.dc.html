<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ticket Booth · Picking favorites</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&amp;family=Arvo:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
a{color:#A51C25}a:hover{color:#7A1219}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3E9D2; color: #1E1A17; font-family: 'Arvo', Georgia, serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 20px 16px 10px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; background: #A51C25; color: #FFF7E6; border-radius: 8px; overflow: hidden">
      <div style="flex: 1; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; border-right: 3px dashed #F3E9D2">
        <div style="font-size: 12px; font-weight: 700; letter-spacing: 3px">ADMIT ONE</div>
        <div style="font-family: 'Alfa Slab One', Georgia, serif; font-size: 30px; line-height: 1">King Size Showdown</div>
      </div>
      <div style="width: 72px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 1px; line-height: 1.3; padding: 0 6px">PLAY<br>HOUSE<br>395</div>
    </div>
    <p style="margin: 0; font-size: 16px; line-height: 1.4; text-align: center">Tap your <b style="color: #A51C25">very favorite</b> first, then your next favorite. Pick as many as you like!</p>
  </header>

  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-content: start">
    <sc-for list="{{candies}}" as="c" hint-placeholder-count="13">
      <sc-if value="{{c.picked}}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{c.pick}}" aria-label="{{c.aria}}" style="display: flex; align-items: stretch; height: 54px; padding: 0; border-radius: 6px; border: 2px solid #1E1A17; background: #1E1A17; color: #FFF7E6; text-align: left; overflow: hidden; transform: rotate(-1deg)">
          <span style="width: 40px; flex: none; background: #A51C25; color: #FFF7E6; font-family: 'Alfa Slab One', Georgia, serif; font-size: 22px; display: flex; align-items: center; justify-content: center; border-right: 2px dashed #F3E9D2">{{c.rank}}</span>
          <span style="flex: 1; display: flex; align-items: center; padding: 0 10px; font-size: 14px; font-weight: 700; line-height: 1.15">{{c.name}}</span>
        </button>
      </sc-if>
      <sc-if value="{{c.notPicked}}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{c.pick}}" aria-label="{{c.aria}}" style="display: flex; align-items: stretch; height: 54px; padding: 0; border-radius: 6px; border: 2px solid #1E1A17; background: #FFFBF0; color: #1E1A17; text-align: left; overflow: hidden">
          <span aria-hidden="true" style="width: 40px; flex: none; background: {{c.bg}}; border-right: 2px dashed #1E1A17"></span>
          <span style="flex: 1; display: flex; align-items: center; padding: 0 10px; font-size: 14px; font-weight: 700; line-height: 1.15">{{c.name}}</span>
        </button>
      </sc-if>
    </sc-for>
  </div>

  <footer style="background: #1E1A17; color: #FFF7E6; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 3px">YOUR TICKETS</span>
      <a href="C-Results.dc.html" style="font-size: 13px; font-weight: 700; color: #F2B8BC">See the standings</a>
    </div>
    <sc-if value="{{hasPicks}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{chosen}}" as="p" hint-placeholder-count="3">
          <span style="display: flex; align-items: center; gap: 6px; border: 1px solid #6E625A; border-radius: 4px; padding: 3px 8px 3px 3px; font-size: 13px; font-weight: 700">
            <span style="width: 22px; height: 22px; border-radius: 3px; background: #A51C25; color: #FFF7E6; font-size: 12px; display: flex; align-items: center; justify-content: center">{{p.n}}</span>
            {{p.name}}
          </span>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{noPicks}}" hint-placeholder-val="{{ false }}">
      <div style="font-size: 14px; color: #D9CDB8; padding: 4px 0">No tickets yet. Tap a candy!</div>
    </sc-if>
    <div style="display: flex; gap: 10px">
      <button type="button" onClick="{{clear}}" style="height: 56px; padding: 0 16px; border-radius: 6px; border: 2px solid #6E625A; background: transparent; color: #FFF7E6; font-size: 15px; font-weight: 700">Start over</button>
      <sc-if value="{{hasPicks}}" hint-placeholder-val="{{ true }}">
        <a href="C-Thanks.dc.html" style="flex: 1; height: 56px; border-radius: 6px; background: #A51C25; color: #FFF7E6; font-family: 'Alfa Slab One', Georgia, serif; font-size: 21px; display: flex; align-items: center; justify-content: center; text-decoration: none">I'm done!</a>
      </sc-if>
      <sc-if value="{{noPicks}}" hint-placeholder-val="{{ false }}">
        <button type="button" disabled="disabled" style="flex: 1; height: 56px; border-radius: 6px; border: 0; background: #4A403A; color: #A99D90; font-family: 'Alfa Slab One', Georgia, serif; font-size: 21px">I'm done!</button>
      </sc-if>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var CANDIES = [
  { id: 'reeses', name: "Reese's Cups", bg: '#F47B20' },
  { id: 'snickers', name: 'Snickers', bg: '#4A2A17' },
  { id: 'kitkat', name: 'Kit Kat', bg: '#C8102E' },
  { id: 'twix', name: 'Twix', bg: '#D4A63A' },
  { id: 'hersheys', name: "Hershey's Milk Chocolate", bg: '#3D2314' },
  { id: 'butterfinger', name: 'Butterfinger', bg: '#FFD200' },
  { id: 'musketeers', name: '3 Musketeers', bg: '#C9D3DB' },
  { id: 'milkyway', name: 'Milky Way', bg: '#2E1B10' },
  { id: 'crunch', name: 'Crunch', bg: '#0A4DA2' },
  { id: 'skittles', name: 'Skittles', bg: '#C8141A' },
  { id: 'starburst', name: 'Starburst', bg: '#FBB8CF' },
  { id: 'mms', name: "Peanut M&M's", bg: '#FDC300' },
  { id: 'cookies', name: "Cookies 'n' Creme", bg: '#DCD6CA' }
];
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var picks = (this.state && this.state.picks) || ['twix', 'mms', 'cookies'];
    var toggle = function (id) {
      var next = picks.slice();
      var i = next.indexOf(id);
      if (i >= 0) { next.splice(i, 1); } else { next.push(id); }
      self.setState({ picks: next });
    };
    var candies = CANDIES.map(function (c) {
      var rank = picks.indexOf(c.id) + 1;
      return {
        id: c.id, name: c.name, bg: c.bg, rank: rank,
        picked: rank > 0, notPicked: rank === 0,
        aria: rank > 0 ? c.name + ', pick number ' + rank : c.name,
        pick: function () { toggle(c.id); }
      };
    });
    var chosen = picks.map(function (id, i) {
      var c = CANDIES.filter(function (x) { return x.id === id; })[0];
      return { n: i + 1, name: c.name };
    });
    return {
      candies: candies, chosen: chosen,
      hasPicks: chosen.length > 0, noPicks: chosen.length === 0,
      clear: function () { self.setState({ picks: [] }); }
    };
  }
}
</script>
</body>
</html>
