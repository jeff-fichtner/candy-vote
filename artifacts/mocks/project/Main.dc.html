<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Marquee · Picking favorites</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Nunito:wght@600;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
a{color:#F5C542}a:hover{color:#FFE08A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #2A0710; color: #FFF4DC; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 18px 16px 10px; display: flex; flex-direction: column; gap: 10px">
    <div style="border: 3px solid #F5C542; border-radius: 16px; background: #4A0E1C; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between" aria-hidden="true">
        <sc-for list="{{bulbs}}" as="b" hint-placeholder-count="14">
          <span style="width: 9px; height: 9px; border-radius: 50%; background: #FFE08A; box-shadow: 0 0 6px 2px rgba(255, 210, 90, 0.7)"></span>
        </sc-for>
      </div>
      <div style="text-align: center; padding: 4px 0">
        <div style="font-family: 'Bungee', system-ui, sans-serif; font-size: 22px; letter-spacing: 3px; color: #FFF4DC">KING SIZE</div>
        <div style="font-family: 'Bungee', system-ui, sans-serif; font-size: 38px; line-height: 1; color: #F5C542">SHOWDOWN</div>
      </div>
      <div style="display: flex; justify-content: space-between" aria-hidden="true">
        <sc-for list="{{bulbs}}" as="b" hint-placeholder-count="14">
          <span style="width: 9px; height: 9px; border-radius: 50%; background: #FFE08A; box-shadow: 0 0 6px 2px rgba(255, 210, 90, 0.7)"></span>
        </sc-for>
      </div>
    </div>
    <p style="margin: 0; font-size: 16px; font-weight: 700; text-align: center; line-height: 1.35">Tap your <span style="color: #F5C542; font-weight: 900">very favorite</span> first, then your next favorite. Pick as many as you like!</p>
  </header>

  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-content: start">
    <sc-for list="{{candies}}" as="c" hint-placeholder-count="13">
      <sc-if value="{{c.picked}}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{c.pick}}" aria-label="{{c.aria}}" style="position: relative; height: 54px; border-radius: 12px; border: 3px solid #F5C542; background: {{c.bg}}; color: {{c.fg}}; font-size: 15px; font-weight: 900; text-align: left; padding: 0 44px 0 12px; box-shadow: 0 0 0 3px #2A0710, 0 0 14px 4px rgba(245, 197, 66, 0.55)">
          {{c.name}}
          <span style="position: absolute; right: 7px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border-radius: 50%; background: #F5C542; color: #2A0710; font-family: 'Bungee', system-ui, sans-serif; font-size: 16px; display: flex; align-items: center; justify-content: center; border: 2px solid #2A0710">{{c.rank}}</span>
        </button>
      </sc-if>
      <sc-if value="{{c.notPicked}}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{c.pick}}" aria-label="{{c.aria}}" style="height: 54px; border-radius: 12px; border: 3px solid transparent; background: {{c.bg}}; color: {{c.fg}}; font-size: 15px; font-weight: 900; text-align: left; padding: 0 12px">{{c.name}}</button>
      </sc-if>
    </sc-for>
  </div>

  <footer style="background: #1A0408; border-top: 2px solid #6B1A2A; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 13px; font-weight: 800; letter-spacing: 1px; color: #E9D8B8">YOUR PICKS</span>
      <a href="A-Results.dc.html" style="font-size: 13px; font-weight: 800">See the standings</a>
    </div>
    <sc-if value="{{hasPicks}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{chosen}}" as="p" hint-placeholder-count="3">
          <span style="display: flex; align-items: center; gap: 6px; background: #3A0A15; border: 1px solid #6B1A2A; border-radius: 999px; padding: 4px 10px 4px 4px; font-size: 14px; font-weight: 800">
            <span style="width: 22px; height: 22px; border-radius: 50%; background: #F5C542; color: #2A0710; font-size: 12px; font-weight: 900; display: flex; align-items: center; justify-content: center">{{p.n}}</span>
            {{p.name}}
          </span>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{noPicks}}" hint-placeholder-val="{{ false }}">
      <div style="font-size: 14px; font-weight: 700; color: #E9D8B8; padding: 4px 0">Nothing yet. Tap a candy!</div>
    </sc-if>
    <div style="display: flex; gap: 10px">
      <button type="button" onClick="{{clear}}" style="height: 56px; padding: 0 18px; border-radius: 14px; border: 2px solid #6B1A2A; background: transparent; color: #FFF4DC; font-size: 16px; font-weight: 800">Start over</button>
      <sc-if value="{{hasPicks}}" hint-placeholder-val="{{ true }}">
        <a href="A-Thanks.dc.html" style="flex: 1; height: 56px; border-radius: 14px; background: #F5C542; color: #2A0710; font-family: 'Bungee', system-ui, sans-serif; font-size: 20px; display: flex; align-items: center; justify-content: center; text-decoration: none">I'm done!</a>
      </sc-if>
      <sc-if value="{{noPicks}}" hint-placeholder-val="{{ false }}">
        <button type="button" disabled="disabled" style="flex: 1; height: 56px; border-radius: 14px; border: 0; background: #5A4A2A; color: #B8A880; font-family: 'Bungee', system-ui, sans-serif; font-size: 20px">I'm done!</button>
      </sc-if>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var CANDIES = [
  { id: 'reeses', name: "Reese's Cups", bg: '#F47B20', fg: '#3A1A0A' },
  { id: 'snickers', name: 'Snickers', bg: '#4A2A17', fg: '#FFFFFF' },
  { id: 'kitkat', name: 'Kit Kat', bg: '#C8102E', fg: '#FFFFFF' },
  { id: 'twix', name: 'Twix', bg: '#D4A63A', fg: '#5A080C' },
  { id: 'hersheys', name: "Hershey's Milk Chocolate", bg: '#3D2314', fg: '#ECECEC' },
  { id: 'butterfinger', name: 'Butterfinger', bg: '#FFD200', fg: '#0B3D91' },
  { id: 'musketeers', name: '3 Musketeers', bg: '#C9D3DB', fg: '#8E0B1B' },
  { id: 'milkyway', name: 'Milky Way', bg: '#2E1B10', fg: '#9AD06B' },
  { id: 'crunch', name: 'Crunch', bg: '#0A4DA2', fg: '#FFFFFF' },
  { id: 'skittles', name: 'Skittles', bg: '#C8141A', fg: '#FFFFFF' },
  { id: 'starburst', name: 'Starburst', bg: '#FBB8CF', fg: '#5E0D33' },
  { id: 'mms', name: "Peanut M&M's", bg: '#FDC300', fg: '#4A2410' },
  { id: 'cookies', name: "Cookies 'n' Creme", bg: '#F4F1EA', fg: '#1C2B5A' }
];
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var picks = (this.state && this.state.picks) || ['snickers', 'reeses', 'kitkat'];
    var toggle = function (id) {
      var next = picks.slice();
      var i = next.indexOf(id);
      if (i >= 0) { next.splice(i, 1); } else { next.push(id); }
      self.setState({ picks: next });
    };
    var candies = CANDIES.map(function (c) {
      var rank = picks.indexOf(c.id) + 1;
      return {
        id: c.id, name: c.name, bg: c.bg, fg: c.fg, rank: rank,
        picked: rank > 0, notPicked: rank === 0,
        aria: rank > 0 ? c.name + ', pick number ' + rank : c.name,
        pick: function () { toggle(c.id); }
      };
    });
    var chosen = picks.map(function (id, i) {
      var c = CANDIES.filter(function (x) { return x.id === id; })[0];
      return { n: i + 1, name: c.name };
    });
    var bulbs = [];
    for (var b = 0; b < 14; b++) { bulbs.push({ i: b }); }
    return {
      candies: candies, chosen: chosen, bulbs: bulbs,
      hasPicks: chosen.length > 0, noPicks: chosen.length === 0,
      clear: function () { self.setState({ picks: [] }); }
    };
  }
}
</script>
</body>
</html>
