<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Matilda · Picking favorites</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&amp;family=Nunito:wght@600;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:default}
a{color:#8AD8F8}a:hover{color:#C6EEFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #2B2463; color: #FFFFFF; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 10px 16px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
    <img src="/_blob/d06176b2dd3cf94c59e94e54169da9aa" alt="Roald Dahl's Matilda The Musical" style="width: 200px; height: 97px; object-fit: cover; display: block">
    <div style="font-size: 12px; font-weight: 800; letter-spacing: 2px; color: #8AD8F8">PLAYHOUSE 395 CAST PRESENTS</div>
    <h1 style="margin: 0; font-family: 'Cinzel', Georgia, serif; font-weight: 900; font-size: 30px; line-height: 1.05; color: #FFFFFF; text-shadow: 2px 2px 0 #3E8FC4, 4px 4px 0 #1C5F8E">King Size Showdown</h1>
    <p style="margin: 6px 0 0; font-size: 15px; font-weight: 600; line-height: 1.35">You get <b style="color: #8AD8F8; font-weight: 900">3 votes</b>. Tap a candy to give it a vote. Love one a lot? Give it 2 or all 3!</p>
  </header>

  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-content: start">
    <sc-for list="{{candies}}" as="c" hint-placeholder-count="13">
      <sc-if value="{{c.has}}" hint-placeholder-val="{{ false }}">
        <div style="position: relative">
          <button type="button" onClick="{{c.add}}" disabled="{{c.full}}" aria-label="{{c.aria}}" style="width: 100%; height: 56px; border-radius: 3px 8px 8px 3px; border: 2px solid #8AD8F8; border-left: 8px solid #8AD8F8; background: #F6F1E4; color: #2B2463; font-size: 14px; font-weight: 900; text-align: left; padding: 4px 40px 4px 10px; box-shadow: 0 0 16px rgba(138, 216, 248, 0.6); display: flex; flex-direction: column; justify-content: center; gap: 4px">
            <span style="line-height: 1.1">{{c.name}}</span>
            <span aria-hidden="true" style="display: flex; gap: 4px">
              <sc-for list="{{c.dots}}" as="d" hint-placeholder-count="1">
                <span style="width: 12px; height: 12px; border-radius: 50%; background: #3E8FC4; border: 2px solid #2B2463; box-sizing: border-box"></span>
              </sc-for>
            </span>
          </button>
          <button type="button" onClick="{{c.remove}}" aria-label="{{c.removeAria}}" style="position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border-radius: 50%; border: 2px solid #2B2463; background: #FFFFFF; color: #2B2463; font-size: 20px; font-weight: 900; line-height: 1; padding: 0; display: flex; align-items: center; justify-content: center">
            <svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12"><path d="M2 6h8" stroke="#2B2463" stroke-width="2.4" stroke-linecap="round"></path></svg>
          </button>
        </div>
      </sc-if>
      <sc-if value="{{c.none}}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{c.add}}" disabled="{{c.full}}" aria-label="{{c.aria}}" style="height: 56px; border-radius: 3px 8px 8px 3px; border: 2px solid #4A4290; border-left: 8px solid {{c.bg}}; background: #3A3280; color: #FFFFFF; font-size: 14px; font-weight: 800; text-align: left; padding: 0 10px; opacity: {{c.fade}}">{{c.name}}</button>
      </sc-if>
    </sc-for>
  </div>

  <footer style="background: #1E1948; border-top: 2px solid #4A4290; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-family: 'Cinzel', Georgia, serif; font-size: 14px; font-weight: 900; letter-spacing: 1px; color: #8AD8F8">My votes</span>
      <a href="F-Results.dc.html" style="font-size: 14px; font-weight: 800">See the standings</a>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <div aria-hidden="true" style="display: flex; gap: 6px">
        <sc-for list="{{slots}}" as="s" hint-placeholder-count="3">
          <sc-if value="{{s.used}}" hint-placeholder-val="{{ true }}">
            <span style="width: 26px; height: 26px; border-radius: 50%; background: #8AD8F8; border: 2px solid #8AD8F8; box-sizing: border-box"></span>
          </sc-if>
          <sc-if value="{{s.open}}" hint-placeholder-val="{{ false }}">
            <span style="width: 26px; height: 26px; border-radius: 50%; background: transparent; border: 2px dashed #8AD8F8; box-sizing: border-box"></span>
          </sc-if>
        </sc-for>
      </div>
      <span style="font-size: 16px; font-weight: 800">{{leftText}}</span>
    </div>
    <div style="display: flex; gap: 10px">
      <button type="button" onClick="{{clear}}" style="height: 56px; padding: 0 16px; border-radius: 12px; border: 2px solid #4A4290; background: transparent; color: #FFFFFF; font-size: 15px; font-weight: 800">Start over</button>
      <sc-if value="{{allUsed}}" hint-placeholder-val="{{ false }}">
        <a href="F-Thanks.dc.html" style="flex: 1; height: 56px; border-radius: 12px; background: #8AD8F8; color: #2B2463; font-family: 'Cinzel', Georgia, serif; font-weight: 900; font-size: 20px; display: flex; align-items: center; justify-content: center; text-decoration: none">I'm done!</a>
      </sc-if>
      <sc-if value="{{notAllUsed}}" hint-placeholder-val="{{ true }}">
        <button type="button" disabled="disabled" style="flex: 1; height: 56px; border-radius: 12px; border: 0; background: #3A3280; color: #8F89C2; font-family: 'Cinzel', Georgia, serif; font-weight: 900; font-size: 20px">I'm done!</button>
      </sc-if>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var CANDIES = [
  { id: 'reeses', name: "Reese's Cups", bg: '#F47B20' },
  { id: 'snickers', name: 'Snickers', bg: '#A0673F' },
  { id: 'kitkat', name: 'Kit Kat', bg: '#E0213F' },
  { id: 'twix', name: 'Twix', bg: '#D4A63A' },
  { id: 'hersheys', name: "Hershey's Milk Chocolate", bg: '#8A5A3C' },
  { id: 'butterfinger', name: 'Butterfinger', bg: '#FFD200' },
  { id: 'musketeers', name: '3 Musketeers', bg: '#C9D3DB' },
  { id: 'milkyway', name: 'Milky Way', bg: '#9AD06B' },
  { id: 'crunch', name: 'Crunch', bg: '#2F7BE0' },
  { id: 'skittles', name: 'Skittles', bg: '#E8262C' },
  { id: 'starburst', name: 'Starburst', bg: '#FBB8CF' },
  { id: 'mms', name: "Peanut M&M's", bg: '#FDC300' },
  { id: 'cookies', name: "Cookies 'n' Creme", bg: '#F4F1EA' }
];
var VOTES = 3;
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var counts = (this.state && this.state.counts) || { kitkat: 2 };
    var used = 0;
    Object.keys(counts).forEach(function (k) { used += counts[k]; });
    var left = VOTES - used;
    var setCount = function (id, n) {
      var next = {};
      Object.keys(counts).forEach(function (k) { next[k] = counts[k]; });
      if (n > 0) { next[id] = n; } else { delete next[id]; }
      self.setState({ counts: next });
    };
    var candies = CANDIES.map(function (c) {
      var n = counts[c.id] || 0;
      var dots = [];
      for (var i = 0; i < n; i++) { dots.push({ i: i }); }
      return {
        id: c.id, name: c.name, bg: c.bg, dots: dots,
        has: n > 0, none: n === 0, full: left === 0,
        fade: left === 0 && n === 0 ? 0.45 : 1,
        aria: n > 0 ? c.name + ', ' + n + (n === 1 ? ' vote' : ' votes') + '. Tap to add a vote' : c.name + '. Tap to give it a vote',
        removeAria: 'Take a vote back from ' + c.name,
        add: function () { if (left > 0) { setCount(c.id, n + 1); } },
        remove: function () { setCount(c.id, n - 1); }
      };
    });
    var slots = [];
    for (var s = 0; s < VOTES; s++) { slots.push({ used: s < used, open: s >= used }); }
    var leftText = left === 0 ? 'All 3 votes used!' : left === 1 ? '1 vote left' : left + ' votes left';
    return {
      candies: candies, slots: slots, leftText: leftText,
      allUsed: used > 0, notAllUsed: used === 0,
      clear: function () { self.setState({ counts: {} }); }
    };
  }
}
</script>
</body>
</html>
